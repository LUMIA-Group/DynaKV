[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynakv"
version = "0.1.0"
description = "Token-wise adaptive low-rank KV-cache compression for Llama 3 and Qwen3"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "accelerate>=1.6,<2",
  "datasets>=3.3,<5",
  "huggingface-hub>=0.31,<1",
  "numpy>=1.26,<3",
  "safetensors>=0.5,<1",
  "torch>=2.6,<2.7",
  "tqdm>=4.67,<5",
  "transformers>=4.53,<4.54",
]

[project.optional-dependencies]
train = ["deepspeed>=0.16,<0.19", "wandb>=0.19,<1"]
kernel = ["triton>=3.2,<3.3"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
